<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>見つかりません - Worklog Lite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/retro-neon.css}" rel="stylesheet">
</head>
<body class="retro-body">
<main class="container py-5">
    <div class="error-panel">
        <div class="brand-mark mb-3">W</div>
        <h1 class="hero-title">404</h1>
        <p class="hero-subtitle">ログ座標が見つかりません</p>
        <p class="mb-4" th:text="${errorMessage}">指定された作業ログが見つかりません</p>
        <a class="neon-btn pink" th:href="@{/logs}">一覧へ戻る</a>
    </div>
</main>
</body>
</html>
