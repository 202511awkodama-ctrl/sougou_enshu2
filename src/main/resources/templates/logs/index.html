<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>作業ログ一覧 - Worklog Lite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h1 class="h3 mb-1">Worklog Lite</h1>
            <p class="text-muted mb-0">作業ログ一覧</p>
        </div>
        <a class="btn btn-primary" th:href="@{/logs/new}">新規作成</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <section class="bg-white border rounded p-3 mb-4">
        <form class="row g-2 align-items-end" method="get" th:action="@{/logs}">
            <div class="col-sm-5 col-md-4">
                <label for="date" class="form-label">日付フィルタ</label>
                <input id="date" class="form-control" type="date" name="date" th:value="${selectedDate}">
            </div>
            <div class="col-auto">
                <button class="btn btn-outline-primary" type="submit">絞り込み</button>
            </div>
            <div class="col-auto">
                <a class="btn btn-outline-secondary" th:href="@{/logs}">解除</a>
            </div>
        </form>

        <div th:if="${selectedDate != null}" class="alert alert-info mt-3 mb-0">
            <span th:text="${selectedDate}"></span>
            の合計作業時間:
            <strong th:text="${totalDuration}">0時間0分</strong>
        </div>
    </section>

    <section class="bg-white border rounded">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>日付</th>
                    <th>時間</th>
                    <th>作業内容</th>
                    <th>カテゴリ</th>
                    <th>時間</th>
                    <th>メモ</th>
                    <th class="text-end">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${log.workDate}">2026-05-11</td>
                    <td>
                        <span th:text="${log.startTime}">09:00</span>
                        -
                        <span th:text="${log.endTime}">10:00</span>
                    </td>
                    <td th:text="${log.taskTitle}">要件整理</td>
                    <td><span class="badge text-bg-secondary" th:text="${log.category}">開発</span></td>
                    <td th:text="${log.formattedDuration}">1時間0分</td>
                    <td th:text="${log.memo}">メモ</td>
                    <td class="text-end">
                        <div class="d-inline-flex gap-2">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/logs/{id}/edit(id=${log.id})}">編集</a>
                            <form method="post" th:action="@{/logs/{id}/delete(id=${log.id})}">
                                <button class="btn btn-sm btn-outline-danger" type="submit">削除</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(logs)}">
                    <td class="text-center text-muted py-4" colspan="7">作業ログはありません</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
