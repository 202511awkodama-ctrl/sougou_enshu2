<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' - Worklog Lite'">作業ログフォーム - Worklog Lite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/retro-neon.css}" rel="stylesheet">
</head>
<body class="retro-body">
<div class="retro-shell">
    <aside class="retro-sidebar">
        <div class="d-flex align-items-center gap-3">
            <div class="brand-mark">W</div>
            <div>
                <p class="brand-title">Worklog Lite</p>
                <div class="brand-subtitle small">ミニ勤怠・作業ログアプリ</div>
            </div>
        </div>

        <div class="sidebar-kicker">- INPUT QUEST</div>
        <nav class="retro-nav">
            <a class="retro-nav-item" th:href="@{/logs}"><span>作業ログ一覧</span><span class="nav-arrow">›</span></a>
            <a class="retro-nav-item active" href="#"><span>ログ入力</span><span class="nav-arrow">›</span></a>
            <a class="retro-nav-item" href="#"><span>カレンダー</span><span class="nav-arrow">›</span></a>
            <a class="retro-nav-item" href="#"><span>設定</span><span class="nav-arrow">›</span></a>
        </nav>

        <div class="level-card">
            <img class="level-art" th:src="@{/img/pixel-hero.png}" alt="" aria-hidden="true">
            <strong>SAVE POINT</strong>
            <div class="retro-muted small mt-1">正しい時間を刻んでEXP獲得</div>
        </div>
    </aside>

    <main class="retro-main">
        <section class="hero-panel mb-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <h1 class="hero-title" th:text="${pageTitle}">作業ログ作成</h1>
                    <p class="hero-subtitle mb-0">ログを刻め。今日の作業が未来の経験値になる。</p>
                </div>
                <a class="neon-btn muted" th:href="@{/logs}">一覧へ戻る</a>
            </div>
        </section>

        <form class="form-panel" method="post" th:action="@{${formAction}}" th:object="${workLog}">
            <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                <div class="fw-semibold mb-1">入力内容を確認してください</div>
                <div th:each="err : ${#fields.allErrors()}" th:text="${err}">入力エラー</div>
            </div>

            <div class="row g-3">
                <div class="col-md-4">
                    <label for="workDate" class="form-label">作業日</label>
                    <input id="workDate" class="form-control" type="date" th:field="*{workDate}">
                    <div class="form-text">作業した日を選択します。</div>
                    <div class="text-danger small mt-1" th:errors="*{workDate}"></div>
                </div>
                <div class="col-md-4">
                    <label for="startTime" class="form-label">開始時刻</label>
                    <input id="startTime" class="form-control" type="time" th:field="*{startTime}">
                    <div class="form-text">例: 09:00</div>
                    <div class="text-danger small mt-1" th:errors="*{startTime}"></div>
                </div>
                <div class="col-md-4">
                    <label for="endTime" class="form-label">終了時刻</label>
                    <input id="endTime" class="form-control" type="time" th:field="*{endTime}">
                    <div class="form-text">開始時刻より後の時刻を入力します。</div>
                    <div class="text-danger small mt-1" th:errors="*{endTime}"></div>
                </div>
                <div class="col-md-8">
                    <label for="taskTitle" class="form-label">作業内容</label>
                    <input id="taskTitle" class="form-control" type="text" th:field="*{taskTitle}" maxlength="120" placeholder="例: 月次レポート作成">
                    <div class="text-danger small mt-1" th:errors="*{taskTitle}"></div>
                </div>
                <div class="col-md-4">
                    <label for="category" class="form-label">カテゴリ</label>
                    <input id="category" class="form-control" type="text" th:field="*{category}" maxlength="60" placeholder="例: 開発">
                    <div class="text-danger small mt-1" th:errors="*{category}"></div>
                </div>
                <div class="col-12">
                    <label for="memo" class="form-label">メモ</label>
                    <textarea id="memo" class="form-control" rows="4" th:field="*{memo}" placeholder="補足や作業メモを入力します"></textarea>
                </div>
            </div>

            <div class="d-flex flex-wrap gap-2 mt-4">
                <button class="neon-btn pink" type="submit">保存 ⚡</button>
                <a class="neon-btn muted" th:href="@{/logs}">キャンセル</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
